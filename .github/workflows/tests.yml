name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      TMDB_READ_TOKEN: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app && xcodebuild -version
      - name: XcodeGen
        run: brew install xcodegen
      - name: Simulateur disponible
        id: sim
        run: |
          name=$(xcrun simctl list devices available | grep -oE "iPhone 1[5-9][^(]*" | head -1 | sed 's/ *$//')
          echo "name=$name" >> "$GITHUB_OUTPUT"; echo "Simulateur : $name"
      - name: Tests
        run: make test SIM="${{ steps.sim.outputs.name }}"
      - name: Couverture
        if: always()
        run: xcrun xccov view --report --only-targets build/Test.xcresult || true
